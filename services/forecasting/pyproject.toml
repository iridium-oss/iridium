[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iridium-forecasting"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "iridium-schemas",
    "pydantic>=2.5.0",
    "numpy>=1.26.0",
    "torch>=2.0.0",
    "scipy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["forecasting*"]
