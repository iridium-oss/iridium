# Graph WaveNet training config. IRIDIUM forecasting.
model:
  num_nodes: 100
  in_channels: 1
  out_channels: 1
  input_len: 12
  horizon: 8
  hidden_dim: 32
  num_layers: 4
  kernel_size: 2
  dropout: 0.3
  use_adaptive_adj: true

training:
  batch_size: 32
  epochs: 100
  learning_rate: 0.001
  early_stopping_patience: 10
  seed: 42
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

data:
  dataset_version: v1
  feature_schema_version: v1
  graph_version: v1
