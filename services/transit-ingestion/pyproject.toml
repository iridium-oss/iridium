[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iridium-transit-ingestion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "iridium-schemas",
    "pydantic>=2.5.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
packages = ["transit_ingestion"]
