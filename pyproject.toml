[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iridium"
version = "0.1.0"
description = "Real-time urban mobility prediction and optimization platform"
readme = "README.md"
license = { text = "EUPL-1.2" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "numpy>=1.26.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "redis>=5.0.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=24.1.0",
    "mypy>=1.8.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "apps*", "services*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "packages", "services", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | __pycache__
)/
'''

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["\\.venv", "node_modules"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "services/earth-observation/earth_observation/sentinel2/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore:datetime.datetime.utcnow.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["apps", "packages", "services"]
omit = ["*/tests/*", "*/__pycache__/*", "*.pyc"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "except ImportError:",
]
fail_under = 100
