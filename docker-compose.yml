## IRIDIUM local development stack
## Run: docker compose --profile core up -d
## Profiles:
## - core: api, web, postgres, redis
## - public-data: core with only public providers enabled
## - live-data: core with live integrations enabled by configuration
## - with-observability: adds Prometheus
##
## Use .env for local overrides. Never commit .env.

services:
  api:
    profiles: ["core", "public-data", "live-data"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://web:3000
      - LOG_LEVEL=INFO
      - IRIDIUM_CORE__API_HOST=0.0.0.0
      - IRIDIUM_CORE__API_PORT=8000
      - IRIDIUM_CORE__CORS_ORIGINS=http://localhost:3000,http://web:3000
      - IRIDIUM_CORE__LOG_LEVEL=INFO
      - IRIDIUM_DB__ENABLED=true
      - IRIDIUM_DB__DSN=postgresql+psycopg://iridium:iridium@postgres:5432/iridium
      - IRIDIUM_CACHE__ENABLED=true
      - IRIDIUM_CACHE__REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read(); print('ok')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: ["core", "public-data", "live-data"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - IRIDIUM_API_INTERNAL_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    profiles: ["core", "public-data", "live-data"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iridium
      POSTGRES_PASSWORD: iridium
      POSTGRES_DB: iridium
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iridium"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    profiles: ["core", "public-data", "live-data"]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    profiles: ["with-observability"]
    ports: ["9090:9090"]
    volumes: ["./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    restart: unless-stopped

volumes:
  postgres_data: {}
