name: Docs

on:
  push:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "*.md"

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871

      - name: Check docs structure
        run: |
          test -f docs/architecture.md
          test -f docs/glossary.md
          echo "Required docs present"

      - name: Check for broken internal links (basic)
        run: |
          for f in docs/*.md; do
            grep -oE '\[.*\]\([^)]+\.md\)' "$f" || true
          done
          echo "Link check completed (manual review recommended)"

      - name: Verify README badges
        run: python scripts/verify_badges.py || echo "Badge check skipped (network or urllib)"
        continue-on-error: true
