name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'packages/schemas/pyproject.toml', 'apps/api/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ./packages/schemas
          pip install pytest pytest-asyncio pytest-cov httpx
          pip install -e ./apps/api 2>/dev/null || pip install fastapi uvicorn pydantic pydantic-settings
        continue-on-error: false

      - name: Run Python tests
        run: python -m pytest tests/ -v --cov=./ --cov-report=xml --cov-report=term
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: backend
          fail_ci_if_error: false

      - name: Repository structure
        run: |
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and test web
        run: |
          cd apps/web
          npm install
          npm run test -- --coverage 2>/dev/null || echo "Frontend tests skipped"
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: apps/web/coverage
          flags: frontend
          fail_ci_if_error: false
