name: Bug Report
description: Report a bug or unexpected behaviour in IRIDIUM
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide enough detail for maintainers to reproduce and diagnose the issue.
        Do not include sensitive data (credentials, real user data, or deployment details).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear description of the bug
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behaviour
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      placeholder: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      placeholder: What actually happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / Commit
      description: Version number or commit hash (e.g. 0.1.0 or abc1234)
      placeholder: 0.1.0 or abc1234
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, runtime, and relevant config (e.g. Python 3.11, Windows 10)
      placeholder: e.g. Python 3.11, Ubuntu 22.04
  - type: textarea
    id: logs
    attributes:
      label: Logs or Error Messages
      description: Relevant log excerpts or stack traces. Redact sensitive data.
      render: shell
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or references
