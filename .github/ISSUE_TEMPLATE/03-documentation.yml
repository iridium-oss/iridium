name: Documentation
description: Suggest improvements or report issues for IRIDIUM docs
title: "[Docs] "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for documentation fixes, new docs, or unclear content.
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What part of the docs does this concern?
      placeholder: e.g. README, docs/deployment.md, API reference, inline comments
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Fix typo or unclear wording
        - Add or extend section
        - Update outdated content
        - API or code reference
        - Other
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should change? Link to file/line if applicable.
      placeholder: Describe the change or paste the proposed text
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, related issues, or constraints
